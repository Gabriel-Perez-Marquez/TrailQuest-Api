spring.application.name=TrailQuest-Api


# URL jdbc
spring.datasource.url=jdbc:h2:./db/basededatos

# Username, pass de la base de datos
spring.datasource.username=sa
spring.datasource.password=

# Le indicamos a JPA/Hibernate que se encargue de generar el DDL
spring.jpa.hibernate.ddl-auto=create-drop

# Habilitamos la consola de H2
# http://localhost:{server.port}/h2-console
# Hay que deshabilitar en la seguridad los frames para que funcione
spring.h2.console.enabled=true

# Habilitamos los mensajes sql en el log
spring.jpa.show-sql=true

logging.level.org.springframework.security=TRACE

jwt.secret=esta_es_una_clave_muy_larga_y_segura_de_mas_de_32_caracteres
jwt.duration=86400